# A hard ceiling on what all sandboxes together can consume on this cluster.
#
# This is the last line of defence against a platform bug: if our own
# accounting is wrong and we try to create ten thousand sandboxes, the API
# server refuses. A quota that never binds costs nothing; the one time it binds
# it prevents an outage.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-ceiling
  namespace: agentorch-sandboxes
spec:
  hard:
    pods: "500"
    requests.cpu: "200"
    requests.memory: 400Gi
    limits.cpu: "200"
    limits.memory: 400Gi
    requests.ephemeral-storage: 500Gi
---
# Defaults and a per-sandbox ceiling, so a sandbox created without explicit
# limits cannot consume a whole node.
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-limits
  namespace: agentorch-sandboxes
spec:
  limits:
    - type: Container
      default:        {cpu: 500m, memory: 256Mi, ephemeral-storage: 1Gi}
      defaultRequest: {cpu: 500m, memory: 256Mi, ephemeral-storage: 1Gi}
      max:            {cpu: "4",  memory: 8Gi,   ephemeral-storage: 20Gi}
